redis:
  host: localhost
  port: 6379
  # password is loaded from the REDIS_PASSWORD environment variable (see .env)

# Redis pub/sub channel to subscribe to for incoming GitHub webhook events
channel: github-webhooks

# Optional: Redis pub/sub channel for custom Docker image push payloads
# Leave unset (or empty) to disable custom payload handling
# custom_channel: custom-image-pushes

# Redis list to push deployment commands onto
deploy_list: deployments

# Identifier included in each deployment message as "target-queue"
target_queue: deploy-queue

# Repositories allowed to trigger deployments (one "org/repo" entry per list item)
whitelist:
  - your-org/your-repo
